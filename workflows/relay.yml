name: relay

# =====================================================================
#  ASESSTME — 24/7 backend relay on GitHub Actions
#  Owner: @dvc | Builder: promode
# ---------------------------------------------------------------------
#  * public repo  -> free, unlimited GitHub Actions minutes
#  * a free SSH reverse tunnel (localhost.run / serveo / bore)
#    publishes the live URL into relay-lease.json
#  * the Android app reads that file to find the backend
#  * this workflow is the watchdog: if the relay died, it restarts it
# =====================================================================

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force a new tunnel even if one is alive'
        required: false
        default: 'false'

permissions:
  contents: write

concurrency:
  group: asesstme-relay
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: watchdog - is a relay already alive?
        id: check
        env:
          FORCE: ${{ github.event.inputs.force || 'false' }}
        run: |
          set -u
          URL=""
          if [ -f relay-lease.json ]; then
            URL=$(node -e "try{console.log(require('./relay-lease.json').url||'')}catch(e){console.log('')}")
            EXP=$(node -e "try{console.log(require('./relay-lease.json').expires||0)}catch(e){console.log(0)}")
          else
            EXP=0
          fi
          NOW=$(date +%s)
          echo "lease url=$URL expires=$EXP now=$NOW"
          ALIVE=no
          if [ "$FORCE" != "true" ] && [ -n "$URL" ] && [ "$EXP" -gt $((NOW + 60)) ]; then
            if curl -sf -m 12 "$URL/health" > /dev/null 2>&1; then
              ALIVE=yes
              echo "relay is alive at $URL - keeping it"
            else
              echo "lease says $URL but health check failed - restarting"
            fi
          fi
          echo "alive=$ALIVE" >> "$GITHUB_OUTPUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: start tunnel + relay
        if: steps.check.outputs.alive != 'yes'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          GROQ_KEY_POOL: ${{ secrets.GROQ_KEY_POOL }}
        run: |
          set -u
          chmod +x relay/tunnel.sh
          # tunnel writes the public URL into relay_url.txt
          nohup ./relay/tunnel.sh > tunnel.out 2>&1 &
          echo "tunnel pid $!"
          # wait for the URL
          for i in $(seq 1 45); do
            if [ -s relay_url.txt ]; then break; fi
            sleep 2
          done
          URL=$(cat relay_url.txt 2>/dev/null || echo "")
          echo "public url: $URL"
          if [ -z "$URL" ]; then
            echo "::error::no tunnel url obtained"
            tail -40 tunnel.log || true
            exit 1
          fi
          # start the relay
          nohup node relay/relay.js > relay.out 2>&1 &
          echo "relay pid $!"
          sleep 6
          curl -sf -m 10 "$URL/health" && echo " <- health ok" || echo "health not reachable yet"
          tail -20 relay.out || true

      - name: publish lease
        if: steps.check.outputs.alive != 'yes'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          set -u
          URL=$(cat relay_url.txt 2>/dev/null || echo "")
          if [ -z "$URL" ]; then exit 0; fi
          node -e '
            const fs=require("fs"),https=require("https");
            const url=process.argv[1], repo=process.env.GITHUB_REPO, tok=process.env.GITHUB_TOKEN;
            const api="https://api.github.com/repos/"+repo+"/contents/relay-lease.json";
            const lease={url, ts:Math.floor(Date.now()/1000),
                         expires:Math.floor(Date.now()/1000)+300,
                         host:"github-actions", service:"asesstme-relay"};
            const content=Buffer.from(JSON.stringify(lease,null,2)).toString("base64");
            const get=(cb)=>https.get(api,{headers:{Authorization:"Bearer "+tok,
              "User-Agent":"asesstme-relay","Accept":"application/vnd.github+json"}},(r)=>{
              const c=[];r.on("data",d=>c.push(d));r.on("end",()=>{let sha=null;
                try{const j=JSON.parse(Buffer.concat(c).toString());sha=j.sha||null;}catch(e){}
                cb(sha);});}).on("error",()=>cb(null));
            get((sha)=>{
              const payload=JSON.stringify({message:"chore: update relay lease",
                content,branch:"main",sha:sha||undefined});
              const r=https.request(api,{method:"PUT",headers:{Authorization:"Bearer "+tok,
                "User-Agent":"asesstme-relay","Content-Type":"application/json",
                "Content-Length":Buffer.byteLength(payload)}},(resp)=>{
                resp.resume();resp.on("end",()=>console.log("lease published",resp.statusCode));});
              r.on("error",(e)=>console.log("publish error",e.message));
              r.write(payload);r.end();
            });
          ' "$URL"

      - name: keep the job alive
        if: steps.check.outputs.alive != 'yes'
        run: |
          while true; do
            sleep 240
            URL=$(cat relay_url.txt 2>/dev/null || echo "")
            if [ -n "$URL" ]; then
              curl -sf -m 10 "$URL/health" >/dev/null 2>&1 && echo "alive $URL" || echo "relay down?"
            else
              echo "no url"
            fi
          done
